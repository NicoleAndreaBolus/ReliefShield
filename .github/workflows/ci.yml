name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js v22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install & Setup Compact Compiler
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf https://github.com/midnightntwrk/compact/releases/latest/download/compact-installer.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          $HOME/.local/bin/compact update || true

      - name: Install Dependencies
        run: npm install

      - name: Verify Compact Compiler Version
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          compact --version || $HOME/.local/bin/compact --version || true

      - name: Compile ReliefShield Compact Contract
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          compact compile +0.31.1 contracts/reliefshield.compact contracts/managed/reliefshield || npm run compile

      - name: Run Test Suite
        run: npm test

      - name: Build Frontend Application
        run: npm run build
